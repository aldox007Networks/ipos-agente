name: Compilar Agente iPOS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar pkg
        run: npm install

      - name: Compilar el agente a .exe
        run: npx pkg . --targets node18-win-x64 --output dist/AgenteImpresionIPOS.exe

      - name: Subir el ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: Agente-Impresion-iPOS
          path: dist/AgenteImpresionIPOS.exe
          retention-days: 30
